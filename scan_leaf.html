<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scan Leaf</title>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e6f7e6;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #28a745;
    }
    #webcam-container, #label-container {
      margin-top: 20px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      margin: 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    button:hover:enabled {
      background-color: #218838;
    }
    .result-box {
      background: white;
      display: inline-block;
      padding: 15px 25px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      font-size: 18px;
      text-align: left;
    }
    .loading {
      font-style: italic;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>🌿 Scan Your Plant Leaf</h1>
  <p>Start the camera and check your plant's health.</p>

  <button onclick="init()" id="startBtn">Start Camera</button>
  <button onclick="predict()" id="predictBtn" disabled>Check Leaf</button>

  <div id="webcam-container"></div>
  <div id="label-container" class="result-box">Loading status will appear here.</div>

  <script type="text/javascript">
    let model, webcam, labelContainer, maxPredictions;
    const predictBtn = document.getElementById("predictBtn");
    const startBtn = document.getElementById("startBtn");

    async function init() {
      try {
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = `<span class="loading">🔄 Loading model and starting camera...</span>`;
        predictBtn.disabled = true;

        const URL = "https://teachablemachine.withgoogle.com/models/R1eSMqjrE/";
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(300, 300, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        document.getElementById("webcam-container").innerHTML = "";
        document.getElementById("webcam-container").appendChild(webcam.canvas);

        labelContainer.innerHTML = "✅ Ready to scan!";
        predictBtn.disabled = false;

      } catch (error) {
        console.error("Error initializing camera or model:", error);
        labelContainer.innerHTML = "❌ Failed to start. Please try again.";
        predictBtn.disabled = true;
      }
    }
   
    async function loop() {
      webcam.update();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      if (!model || !webcam) {
        labelContainer.innerHTML = "Please start the camera first.";
        return;
      }

      const prediction = await model.predict(webcam.canvas);
      prediction.sort((a, b) => b.probability - a.probability);

      let resultHTML = "<strong>Predictions:</strong><br>";
      prediction.forEach(p => {
        resultHTML += `${p.className}: ${(p.probability * 100).toFixed(2)}%<br>`;
      });

      labelContainer.innerHTML = resultHTML;

      const topPrediction = prediction[0];
      const spokenText = `The leaf is likely ${topPrediction.className} with ${(
        topPrediction.probability * 100
      ).toFixed(1)} percent confidence.`;

      const utterance = new SpeechSynthesisUtterance(spokenText);
      speechSynthesis.speak(utterance);
    }
  </script>
  
</body>
</html>
